[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-scientist"
version = "0.1.0"
description = "Deterministic research orchestration backbone for AI Quant Scientist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"openai>=3.3.0,<4",
	"pydantic>=1.9.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
